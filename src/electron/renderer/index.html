<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self'; script-src 'self';"
    />
    <title>Splatoon Statistics</title>
    <link rel="stylesheet" href="renderer.css" />
  </head>
  <body>
    <main class="app">
      <section class="sessions" aria-labelledby="titre-sessions">
        <header class="sessions__entete">
          <h1 id="titre-sessions">Sessions</h1>
          <p class="sessions__compte" id="sessions-compte"></p>
        </header>
        <ul class="sessions__liste" id="sessions-liste"></ul>
        <p class="sessions__vide" id="sessions-vide" hidden>
          Aucune session enregistrée. Récupérez-en une à droite.
        </p>
        <p class="bandeau bandeau--avertissement" id="sessions-erreurs" hidden></p>
      </section>

      <section class="recuperation" aria-labelledby="titre-recuperation">
        <h2 id="titre-recuperation">Nouvelle récupération</h2>

        <div id="vue-formulaire">
          <form class="formulaire" id="formulaire" novalidate>
            <div class="champ">
              <label for="champ-nom">Nom de la session</label>
              <input
                type="text"
                id="champ-nom"
                name="name"
                placeholder="Scrim contre Les Corsaires"
                autocomplete="off"
              />
            </div>

            <div class="champ champ--double">
              <div>
                <label for="champ-debut">Début</label>
                <input type="datetime-local" id="champ-debut" name="from" required />
              </div>
              <div>
                <label for="champ-fin">Fin</label>
                <input type="datetime-local" id="champ-fin" name="to" />
              </div>
            </div>

            <div class="champ champ--double">
              <div>
                <label for="champ-type">Type</label>
                <select id="champ-type" name="type"></select>
              </div>
              <div>
                <label for="champ-lobby">Lobby</label>
                <select id="champ-lobby" name="lobby"></select>
              </div>
            </div>

            <div class="champ">
              <label for="champ-compte">Compte stat.ink</label>
              <input type="text" id="champ-compte" name="user" autocomplete="off" />
            </div>

            <button type="submit" id="bouton-previsualiser">Prévisualiser</button>
          </form>
        </div>

        <div id="vue-apercu" hidden>
          <p class="resume" id="apercu-resume"></p>
          <div class="matchs" id="apercu-matchs"></div>
          <div class="actions">
            <button type="button" id="bouton-enregistrer">Enregistrer la session</button>
            <button type="button" class="bouton--discret" id="bouton-annuler">Annuler</button>
          </div>
        </div>

        <div id="vue-fiche" hidden>
          <div class="champ">
            <label for="fiche-nom">Nom de la session</label>
            <input type="text" id="fiche-nom" autocomplete="off" />
          </div>
          <div class="champ">
            <label for="fiche-type">Type</label>
            <select id="fiche-type"></select>
          </div>
          <div class="champ">
            <label for="fiche-objectif">Objectif de la session</label>
            <input
              type="text"
              id="fiche-objectif"
              placeholder="Tenir le rôle de support"
              autocomplete="off"
            />
          </div>
          <div class="champ">
            <label for="fiche-ressenti">Ressenti</label>
            <textarea
              id="fiche-ressenti"
              rows="3"
              placeholder="Ce que les chiffres ne disent pas."
            ></textarea>
          </div>
          <p class="resume" id="fiche-resume"></p>
          <div class="matchs" id="fiche-matchs"></div>
          <div class="actions">
            <button type="button" id="bouton-fiche-enregistrer">Enregistrer</button>
            <button type="button" class="bouton--danger" id="bouton-supprimer">Supprimer</button>
            <button type="button" class="bouton--discret" id="bouton-retour">Retour</button>
          </div>

          <section class="compte-rendu" aria-labelledby="titre-compte-rendu">
            <h3 id="titre-compte-rendu">Compte rendu</h3>
            <fieldset class="sections">
              <legend>Sections à inclure</legend>
              <div id="compte-rendu-sections"></div>
            </fieldset>
            <div class="actions">
              <button type="button" id="bouton-generer">Générer</button>
              <button type="button" class="bouton--discret" id="bouton-copier" disabled>
                Copier
              </button>
              <button type="button" class="bouton--discret" id="bouton-planche">
                Fabriquer la planche
              </button>
              <button type="button" class="bouton--discret" id="bouton-planche-ouvrir" hidden>
                Ouvrir le dossier
              </button>
            </div>
            <p class="planche__resultat" id="planche-resultat" hidden></p>
            <div class="onglets" id="compte-rendu-onglets" role="tablist" hidden>
              <button type="button" role="tab" id="onglet-apercu" aria-selected="true">
                Aperçu
              </button>
              <button type="button" role="tab" id="onglet-markdown" aria-selected="false">
                Markdown
              </button>
            </div>
            <div
              id="compte-rendu-apercu"
              class="compte-rendu__apercu"
              role="tabpanel"
              aria-labelledby="onglet-apercu"
              hidden
            ></div>
            <textarea
              id="compte-rendu-texte"
              class="compte-rendu__texte"
              rows="16"
              spellcheck="false"
              aria-label="Compte rendu en Markdown"
              role="tabpanel"
              aria-labelledby="onglet-markdown"
              hidden
            ></textarea>
          </section>
        </div>

        <div id="vue-manche" hidden>
          <div class="manche__entete">
            <h3 id="manche-position"></h3>
            <div class="actions">
              <button type="button" class="bouton--discret" id="bouton-manche-precedente">
                ‹ Précédente
              </button>
              <button type="button" class="bouton--discret" id="bouton-manche-suivante">
                Suivante ›
              </button>
              <button type="button" class="bouton--discret" id="bouton-manche-retour">
                Retour
              </button>
            </div>
          </div>
          <p class="resume" id="manche-resume"></p>
          <p class="manche__medailles" id="manche-medailles" hidden></p>
          <div id="manche-equipes"></div>
          <p class="manche__lien">
            <button type="button" class="bouton--discret" id="bouton-manche-statink">
              Ouvrir sur stat.ink
            </button>
          </p>
        </div>

        <p class="bandeau bandeau--progression" id="progression" hidden></p>
        <p class="bandeau bandeau--erreur" id="erreur" hidden></p>
        <p class="bandeau bandeau--avertissement" id="avertissement" hidden></p>
        <p class="bandeau bandeau--succes" id="succes" hidden></p>
      </section>
    </main>

    <script type="module" src="renderer.js"></script>
  </body>
</html>
